apiVersion: 1

groups:
  - orgId: 1
    name: logistics-agent
    folder: Logistics Agent
    interval: 1m
    rules:
      - uid: logistics-p95-latency
        title: Logistics agent p95 latency is high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "p95 request latency is above 10 seconds"
          description: "Investigate model, SQL, Pinecone, weather, or routing latency."
        labels:
          severity: warning
          service: logistics-agent
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: logistics_request_latency_ms_quantile{quantile="0.95"}
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "-100"
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "-100"
            model:
              expression: B
              evaluator:
                params:
                  - 10000
                type: gt
              refId: C
              type: threshold

      - uid: logistics-model-quota
        title: Logistics model quota failure
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "A model quota or rate limit failure was recorded"
          description: "Check provider quota and billing before retrying requests."
        labels:
          severity: critical
          service: logistics-agent
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: logistics_failure_model_quota_failure_total
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: "-100"
            model:
              expression: B
              evaluator:
                params:
                  - 0
                type: gt
              refId: C
              type: threshold

      - uid: logistics-audit-write-failure
        title: Logistics audit write failure
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Audit events are not being written"
          description: "Investigate the audit database and permissions immediately."
        labels:
          severity: critical
          service: logistics-agent
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: logistics_audit_write_failure_total
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: "-100"
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: "-100"
            model:
              expression: B
              evaluator:
                params:
                  - 0
                type: gt
              refId: C
              type: threshold
